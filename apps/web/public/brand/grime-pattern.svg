<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" preserveAspectRatio="none">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.36
                             0 0 0 0 0.31
                             0 0 0 0 0.25
                             0 0 0 0.55 0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#5C5040"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.85"/>
  <!-- 얼룩 -->
  <g fill="#3F3528" opacity="0.7">
    <ellipse cx="80" cy="120" rx="48" ry="20" transform="rotate(20 80 120)"/>
    <ellipse cx="320" cy="180" rx="60" ry="24" transform="rotate(-15 320 180)"/>
    <ellipse cx="200" cy="60" rx="36" ry="14" transform="rotate(8 200 60)"/>
    <ellipse cx="160" cy="300" rx="52" ry="22" transform="rotate(-25 160 300)"/>
    <ellipse cx="340" cy="340" rx="44" ry="18" transform="rotate(12 340 340)"/>
  </g>
  <g fill="#7A6B55" opacity="0.4">
    <ellipse cx="120" cy="220" rx="80" ry="34" transform="rotate(-10 120 220)"/>
    <ellipse cx="280" cy="80" rx="60" ry="24" transform="rotate(20 280 80)"/>
  </g>
</svg>
